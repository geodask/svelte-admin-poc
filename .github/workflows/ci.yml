name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, lint, unit and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Unit
        run: bun run test:unit

      - name: Build the demo
        run: bun run build

      # Kit's own client/server guard has a known gap (PER-9), so grep the client output.
      - name: Check the client build for server-only code
        run: bun run check:client-bundle

      - name: Install Playwright's Chromium
        working-directory: apps/demo
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run test:e2e
        env:
          # The demo was built above; Playwright serves that build.
          SKIP_BUILD: '1'
